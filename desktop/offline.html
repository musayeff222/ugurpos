<!DOCTYPE html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UgurPOS — İnternet lazımdır</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Segoe UI, sans-serif;
        background: #111827;
        color: #f9fafb;
      }
      .box {
        max-width: 440px;
        padding: 32px;
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 24px;
      }
      p {
        margin: 0 0 24px;
        color: #d1d5db;
        line-height: 1.5;
      }
      button {
        border: 0;
        background: #16a34a;
        color: #fff;
        padding: 12px 22px;
        border-radius: 8px;
        font-size: 15px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>İlk giriş üçün internet lazımdır</h1>
      <p>
        UgurPOS admin girişini açır. İlk dəfə onlayn daxil olun — sonra internet
        kəsiləndə kassa və xərc işləyəcək.
      </p>
      <button type="button" id="retry">Yenidən cəhd et</button>
    </div>
    <script>
      const site = "https://cigkofte.az/login/admin";
      document.getElementById("retry").onclick = function () {
        location.href = site;
      };
      window.addEventListener("online", function () {
        location.href = site;
      });
    </script>
  </body>
</html>
